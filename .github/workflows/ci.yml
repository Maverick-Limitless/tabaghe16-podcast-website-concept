# Quality checks for every push and pull request to main.
#
# Least privilege: the workflow reads the repository and installs
# dependencies; it uploads no artifacts and publishes no reports — detailed
# output stays in the run log only. The E2E job runs against the
# rights-safe demo store that ships with the checkout, and blocks all
# third-party network requests per-test, so CI never touches an external
# service.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # repo HEAD, verified 2026-10-27

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # repo HEAD, verified 2026-10-27
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Production build (rights-safe demo mode)
        run: pnpm run build

      - name: Install browsers for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests against the production build
        run: pnpm exec playwright test --project=mobile --project=desktop

      - name: Dependency audit
        run: pnpm audit --prod
