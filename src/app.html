<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The Content Security Policy is generated by SvelteKit's `kit.csp`
      configuration in vite.config.ts (docs/ARCHITECTURE.md §8.4). A static
      meta tag here cannot hash SvelteKit's own inline scripts, and an
      un-hashed strict script-src blocks the app bootstrap outright — so the
      policy lives in the config, where SvelteKit augments script-src with
      the hashes of its inline bootstrap on prerendered pages.
    -->

    <title>طبقه ۱۶ — پادکستِ گفت‌وگو</title>
    <meta name="description" content="آرشیف گفت‌وگوهای پادکست طبقه ۱۶، به ترتیب تاریخ انتشار." />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
